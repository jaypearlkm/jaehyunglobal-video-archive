<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f4efe6">
<meta name="description" content="JAEHYUN GLOBAL Video Archive — a curated collection of Jaehyun's music, performances and videos.">
<title>Video Archive — JAEHYUN GLOBAL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Italiana&display=swap" rel="stylesheet">
<style>
:root{--paper:#f4efe6;--paper2:#e9dfd0;--ink:#28231f;--muted:#786e62;--line:#332b24;--accent:#b78b62;--card:#e7ddce;--white:#fffaf2}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:"DM Sans",Arial,sans-serif}
a{color:inherit}.top{padding:15px max(22px,5.5vw) 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.live{display:flex;gap:8px;align-items:center}.dot{width:7px;height:7px;background:#a65b4d;border-radius:50%;display:inline-block}
.crumb{display:flex;gap:14px}.crumb a{text-decoration:none;border-bottom:2px solid transparent;padding-bottom:4px}.crumb a:hover,.crumb a.active{border-color:var(--accent)}
.hero{padding:34px max(22px,5.5vw) 28px;border-bottom:2px solid var(--line);background:linear-gradient(110deg,#f4efe6 0%,#eee4d7 100%)}
.kicker{font-size:10px;letter-spacing:.22em;font-weight:800;color:var(--muted);text-transform:uppercase}
h1{margin:10px 0 8px;font-size:clamp(34px,7vw,76px);line-height:.92;letter-spacing:-.065em;font-weight:800;text-transform:uppercase}
h1 span{font-family:Italiana,serif;font-weight:400;font-style:italic;letter-spacing:-.025em}
.intro{font-size:13px;color:var(--muted);max-width:560px;line-height:1.7;margin:15px 0 0}
.controls{padding:20px max(22px,5.5vw) 15px;display:flex;gap:9px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.filters{display:flex;gap:8px;flex-wrap:wrap;flex:1}
.filter{border:1.4px solid var(--line);background:transparent;color:var(--ink);border-radius:4px;padding:9px 13px;font:800 10px "DM Sans";letter-spacing:.06em;cursor:pointer}
.filter.active,.filter:hover{background:var(--accent);color:#fffaf2}
.search{border:1.4px solid var(--line);background:#fffaf2;padding:9px 12px;min-width:180px;max-width:100%;font:12px "DM Sans";border-radius:3px}
.content{margin:0 max(22px,5.5vw) 45px;padding:18px;background:#eae4dc;border:1.5px solid var(--line)}
.resultline{display:flex;justify-content:space-between;align-items:center;margin:0 0 13px;font-size:10px;letter-spacing:.12em;font-weight:800;color:var(--muted);text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{background:var(--card);border:1.5px solid var(--line);padding:10px;box-shadow:2px 2px 0 rgba(40,35,31,.12);transition:transform .18s,box-shadow .18s}
.card:hover{transform:translateY(-3px);box-shadow:4px 5px 0 rgba(40,35,31,.18)}
.thumb{position:relative;aspect-ratio:16/9;background:#d1c5b6;overflow:hidden;border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.tag{position:absolute;top:9px;left:9px;background:var(--accent);color:white;padding:5px 8px;font-size:9px;font-weight:800;letter-spacing:.08em}
.play{position:absolute;right:10px;bottom:10px;width:38px;height:38px;border:0;border-radius:50%;background:rgba(255,250,242,.96);color:var(--ink);display:grid;place-items:center;font-size:15px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.inline-player{position:absolute;inset:0;width:100%;height:100%;background:#000}
.inline-player iframe{width:100%;height:100%;border:0;display:block}
.thumb.playing img,.thumb.playing .play,.thumb.playing .tag{display:none}
.card h2{font-size:13px;line-height:1.4;margin:10px 0 5px;font-weight:800}
.meta{font-size:10px;color:var(--muted);line-height:1.6}
.empty{grid-column:1/-1;text-align:center;padding:40px 10px;color:var(--muted);font-size:13px}
footer{padding:25px max(22px,5.5vw);border-top:1px solid var(--line);font-size:10px;letter-spacing:.12em;color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

@media(max-width:560px){.top{padding:13px 16px}.crumb{gap:9px;font-size:9px}.hero{padding:27px 20px 23px}.controls{padding:16px 16px 13px}.search{width:100%;flex:1}.content{margin:0 12px 30px;padding:10px}.grid{gap:9px}.card{padding:7px}.card h2{font-size:11px}.meta{font-size:9px}.tag{font-size:8px;top:6px;left:6px;padding:4px 6px}.play{width:27px;height:27px}.resultline{font-size:9px}}
@media(min-width:900px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{padding:12px}.content{padding:22px}}
</style>
</head>
<body>
<header class="top">
  <div class="live"><i class="dot"></i> ARCHIVE ONLINE</div>
  <nav class="crumb"><a href="https://jaehyunglobal.dev">⌂ JAEHYUN GLOBAL</a><a class="active" href="#">VIDEO ARCHIVE</a></nav>
</header>
<section class="hero">
  <div class="kicker">JAEHYUN GLOBAL PRESENTS</div>
  <h1>VIDEO <span>ARCHIVE</span></h1>
  <p class="intro">A curated collection of Jaehyun's music, performances and moments.<br>Explore the archive, one video at a time.</p>
</section>
<section class="controls">
  <div class="filters" id="filters">
    <button class="filter active" data-filter="ALL">ALL</button>
    <button class="filter" data-filter="OFFICIAL">OFFICIAL</button>
    <button class="filter" data-filter="FANCAM">FANCAM</button>
    <button class="filter" data-filter="PERFORMANCE">PERFORMANCE</button>
    <button class="filter" data-filter="MUSIC SHOW">MUSIC SHOW</button>
    <button class="filter" data-filter="SHORTS">SHORTS</button>
  </div>
  <input class="search" id="search" type="search" placeholder="Search videos...">
</section>
<main class="content">
  <div class="resultline"><span>THE COLLECTION</span><span id="count">0 VIDEOS</span></div>
  <div class="grid" id="grid"></div>
</main>
<footer><span>JAEHYUN GLOBAL · VIDEO ARCHIVE</span><span>UNOFFICIAL FAN-MADE ARCHIVE</span></footer>
<script>
let videos=[], active="ALL";
const grid=document.querySelector("#grid"), search=document.querySelector("#search");
const safe=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function render(){
 const q=search.value.trim().toLowerCase();
 const list=videos.filter(v=>(active==="ALL"||v.type===active||v.category===active)&&(`${v.title} ${v.description} ${v.category} ${v.type}`).toLowerCase().includes(q));
 document.querySelector("#count").textContent=`${list.length} VIDEOS`;
 grid.innerHTML=list.length?list.map(v=>`<article class="card" data-id="${safe(v.id)}"><div class="thumb" data-video="${safe(v.id)}"><img loading="lazy" src="https://img.youtube.com/vi/${encodeURIComponent(v.youtubeId)}/hqdefault.jpg" alt="${safe(v.title)}"><span class="tag">${safe(v.type||v.category||"VIDEO")}</span><button class="play" type="button" aria-label="Play ${safe(v.title)}">▶</button></div><h2>${safe(v.title)}</h2><div class="meta">${safe(v.description||"JAEHYUN GLOBAL ARCHIVE")} · ${safe(v.date||"")}</div></article>`).join(""):`<div class="empty">No videos found in this collection.</div>`;
 grid.querySelectorAll(".play").forEach(btn=>btn.addEventListener("click",e=>{e.stopPropagation();playInline(btn.closest(".thumb").dataset.video)}));
}
function playInline(id){
 const v=videos.find(x=>x.id===id);const thumb=[...grid.querySelectorAll(".thumb")].find(el=>el.dataset.video===id);if(!v||!thumb||thumb.classList.contains("playing"))return;
 thumb.classList.add("playing");
 const player=document.createElement("div");player.className="inline-player";
 player.innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(v.youtubeId)}?autoplay=1&rel=0&playsinline=1" title="${safe(v.title)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>`;
 thumb.appendChild(player);
}
document.querySelector("#filters").addEventListener("click",e=>{const b=e.target.closest("button[data-filter]");if(!b)return;active=b.dataset.filter;document.querySelectorAll(".filter").forEach(x=>x.classList.toggle("active",x===b));render()});
search.addEventListener("input",render);
fetch("./videos.json").then(r=>r.json()).then(data=>{videos=data;render()}).catch(()=>{grid.innerHTML='<div class="empty">Could not load videos.json. Please check the deployment files.</div>'});
</script>
</body></html>
